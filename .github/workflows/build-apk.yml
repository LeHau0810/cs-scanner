name: Build Flet APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout code
        uses: actions/checkout@v4

      - name: 2. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 5. Install dependencies and Build APK
        run: |
          python -m pip install --upgrade pip
          pip install flet opencv-python-headless pillow numpy pypdf
          # Kiểm tra nếu main.py nằm trong src/ thì trỏ tới src/main.py, nếu không thì dùng main.py
          if [ -f "src/main.py" ]; then
            flet build apk src/main.py --verbose
          else
            flet build apk main.py --verbose
          fi

      - name: 6. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PyScanner-Pro-APK
          path: build/apk/*.apk
