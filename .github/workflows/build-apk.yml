name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cài Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Lưu đệm (Cache) Gradle & Flutter để build nhanh và tránh lỗi 504
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
            ~/flutter
          key: ${{ runner.os }}-flet-gradle-cache-v2

      - name: Cấu hình Timeout cho Gradle
        run: |
          mkdir -p ~/.gradle/wrapper/dists
          export JAVA_TOOL_OPTIONS="-Dorg.gradle.internal.http.connectionTimeout=180000 -Dorg.gradle.internal.http.socketTimeout=180000"
          echo "JAVA_TOOL_OPTIONS=$JAVA_TOOL_OPTIONS" >> $GITHUB_ENV

      - name: Chấp nhận giấy phép Android SDK
        run: |
          set +o pipefail
          SDKM="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKM" ]; then yes | "$SDKM" --licenses > /dev/null 2>&1 || true; fi

      - name: Cài Flet
        run: pip install -U flet

      - name: Build APK (Có tự động trả lời Yes & thử lại nếu nghẽn mạng)
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: "1"
          CI: "true"
        run: |
          set +o pipefail
          for i in 1 2 3; do
            echo "=== Lần thử build thứ $i ==="
            # Đổi link tải Gradle từ GitHub sang CDN chính thức của Gradle nếu có file properties
            find /home/runner /tmp build -name "gradle-wrapper.properties" 2>/dev/null | while read prop; do
              sed -i 's|https\\://github.com/gradle/gradle-distributions/releases/download/v[^/]*/|https\\://services.gradle.org/distributions/|g' "$prop" 2>/dev/null || true
            done

            # Truyền cờ --yes (và dự phòng yes | với set +o pipefail để không bao giờ lỗi Broken pipe)
            if yes | flet build apk --yes --verbose --no-rich-output; then
              echo "✅ Build APK thành công!"
              exit 0
            fi
            echo "⚠️ Lần thử $i thất bại, đợi 15 giây rồi thử lại..."
            sleep 15
          done
          exit 1

      - name: Tải APK lên mục Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CS-Scanner-APK
          path: build/apk/*.apk
          retention-days: 30
