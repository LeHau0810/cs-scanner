name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cài Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Lưu đệm (Cache) Gradle & Flutter để tránh lỗi mạng 504
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-cache-v1

      - name: Tải sẵn Gradle bằng curl (Có tự động thử lại nếu lỗi 504)
        run: |
          mkdir -p ~/.gradle/wrapper/dists
          # Tăng thời gian chờ mạng cho Gradle Wrapper
          export JAVA_TOOL_OPTIONS="-Dorg.gradle.internal.http.connectionTimeout=180000 -Dorg.gradle.internal.http.socketTimeout=180000"
          echo "JAVA_TOOL_OPTIONS=$JAVA_TOOL_OPTIONS" >> $GITHUB_ENV

      - name: Chấp nhận giấy phép Android SDK
        run: |
          SDKM="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKM" ]; then yes | "$SDKM" --licenses > /dev/null || true; fi

      - name: Cài Flet
        run: pip install -U flet

      - name: Build APK (Tự động thử lại tối đa 3 lần nếu nghẽn mạng)
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: "1"
          CI: "true"
        run: |
          for i in 1 2 3; do
            echo "=== Lần thử build thứ $i ==="
            # Nếu lần trước tạo ra file gradle-url hướng về github bị lỗi 504, đổi sang CDN chính của Gradle
            find ~/.flutter /tmp build -name "gradle-wrapper.properties" 2>/dev/null | while read prop; do
              sed -i 's|https\\://github.com/gradle/gradle-distributions/releases/download/v\([0-9.]*\)/|https\\://services.gradle.org/distributions/|g' "$prop" || true
            done

            if flet build apk --verbose --no-rich-output; then
              echo "✅ Build APK thành công!"
              exit 0
            fi
            echo "⚠️ Lần thử $i thất bại (do nghẽn mạng), đợi 15 giây rồi thử lại..."
            sleep 15
          done
          exit 1

      - name: Tải APK lên mục Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CS-Scanner-APK
          path: build/apk/*.apk
          retention-days: 30
