name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:   # cho phép bấm nút chạy tay trên tab Actions

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cài Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cài Flet
        run: pip install -U flet

      - name: Build APK
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: "1"
          CI: "true"
        run: yes | flet build apk --verbose --no-rich-output

      - name: Tải APK lên mục Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CS-Scanner-APK
          path: build/apk/*.apk
          retention-days: 30
