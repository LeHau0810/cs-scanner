[project]
name = "cs_scanner"
version = "5.0.0"
description = "CS Scanner Pro"
dependencies = [
    "flet",
    "opencv-python-headless",
    "pillow",
    "numpy",
    "pypdf"
]

[tool.flet]
org = "com.csscanner"
product = "CS Scanner Pro"

[tool.flet.android]
permission.CAMERA = true
permission.READ_EXTERNAL_STORAGE = true
permission.WRITE_EXTERNAL_STORAGE = true
